name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Download and Unpack OpenWrt Snapshot SDK
        run: |
          # Fetch the official SDK image matching your physical hardware platform architecture
          wget https://openwrt.org
          tar --use-compress-program=zstd -xf openwrt-sdk-*.tar.zst
          mv openwrt-sdk-*-mediatek-filogic_* openwrt_sdk

      - name: Set Up Package Feeds
        run: |
          cd openwrt_sdk
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound unbound-control

      - name: Force Enable Subnetcache in Makefile Build Configuration
        run: |
          cd openwrt_sdk
          
          # HARDCODE FIX: Overrides the default compilation configurations inside the package blueprint
          sed -i 's/--disable-subnet/--enable-subnet/g' feeds/packages/net/unbound/Makefile
          
          # Force patch the internal OpenWrt build selector variables to link dependencies natively
          sed -i '/define Package\/unbound-daemon/,/^$/ s/DEPENDS:=/DEPENDS:=+unbound-subnetcache /' feeds/packages/net/unbound/Makefile

      - name: Configure Target Architecture Variables
        run: |
          cd openwrt_sdk
          make defconfig
          
          # Toggle user-facing menu options to confirm the engine processes the changes
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          echo "CONFIG_UNBOUND_SUBNETCACHE=y" >> .config
          
          make defconfig

      - name: Fast 2-Minute SDK Package Compilation
        run: |
          cd openwrt_sdk
          export FORCE_UNSAFE_CONFIGURE=1
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: openwrt_sdk/bin/**/*.apk
