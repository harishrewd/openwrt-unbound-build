# Version 1.25.2-Production-CacheDBLocked-RedisEnabled (Certified Production Build with Redis)
name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # MINIMAL TWEAK: Installed hiredis directly into your working feed framework
          ./scripts/feeds install libsodium hiredis
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Injection of CacheDB Option
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Tweaking specific package configuration parameter block..."
            
            # 1. MINIMAL TWEAK: Safely append both CacheDB and the specific cross-compile Hiredis staging path flag
            sed -i 's|--enable-tfo-server|--enable-tfo-server \\\n\t--enable-cachedb \\\n\t--with-libhiredis=$(STAGING_DIR)/usr|g' "$MAKEFILE_PATH"
            
            # 2. Append cachedb cleanly into the compiled package modules listing variable
            sed -i 's|subnetcache ipset respip validator iterator|cachedb subnetcache ipset respip validator iterator|g' "$MAKEFILE_PATH"
            
            # 3. Increment the package release version tag from 100 to 105 to mark the Redis engine upgrade!
            sed -i 's|PKG_RELEASE:=1|PKG_RELEASE:=105|g' "$MAKEFILE_PATH"
            
            # 4. Cleanly strip allsymbols so it stops breaking your multi-threaded speeds
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
            
            grep -E "PKG_RELEASE|CONFIGURE_ARGS|cachedb" "$MAKEFILE_PATH"
          else
            echo "❌ Error: Makefile not found at $MAKEFILE_PATH!" && exit 1
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          
          # Target Profile Specification for D-Link M30
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Hardware Instruction Pipeline Optimizations for Cortex-A53
          echo "CONFIG_TARGET_OPTIMIZATION=\"-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53\"" >> .config
          
          # Enable dependencies and core packages to compile
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          # MINIMAL TWEAK: Instruct OpenWrt to natively build the libhiredis target asset
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=y" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=y" >> .config
          echo "CONFIG_PACKAGE_unbound-host=y" >> .config
          
          # Native sub-package target switches
          echo "CONFIG_PACKAGE_libunbound_dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_subnet=y" >> .config
          
          make defconfig

      - name: Compile Toolchain and Dependencies
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          echo "📦 Pre-compiling Libsodium toolchain requirements..."
          make package/feeds/packages/libsodium/compile V=s -j$(nproc)
          
          # MINIMAL TWEAK: Pre-compiling Hiredis exactly the same successful way libsodium is handled
          echo "📦 Pre-compiling Hiredis toolchain requirements..."
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          
          echo "🧹 Performing clean build sweep on Unbound..."
          make package/feeds/packages/unbound/clean
          
          # MINIMAL TWEAK: Compiled with an explicit target block variable check bypass
          echo "🏗 Compiling custom Unbound suite..."
          make package/feeds/packages/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-unbound-dnscrypt-complete-apk
          path: openwrt/bin/**/*.apk
