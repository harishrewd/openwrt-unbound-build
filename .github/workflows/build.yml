name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Direct official container for your router's architecture (MediaTek Filogic)
      image: openwrt/sdk:mediatek-filogic

    steps:
      - name: Update Feeds and Configure Unbound
        run: |
          # Step into the pre-configured SDK workspace
          cd /home/build/openwrt
          
          # Force refresh package sources
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound
          
          # Enable your hardware target rules
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Force compile Unbound with the exact subnet cache module flag enabled
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_UNBOUND_SUBNETCACHE=y" >> .config
          make defconfig

      - name: Compile Package
        run: |
          cd /home/build/openwrt
          # Compile only the single target package immediately without building tools
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-apk
          path: /home/build/openwrt/bin/packages/aarch64_cortex-a53/packages/unbound-daemon_*.apk
