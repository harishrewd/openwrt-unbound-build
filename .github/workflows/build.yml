name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies and Unpackers
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Download and Unpack OpenWrt 25.12.5 SDK
        run: |
          # Fetch the official SDK file for MediaTek Filogic matching your release
          wget https://openwrt.org
          
          # Unpack the file safely
          tar --use-compress-program=zstd -xf openwrt-sdk-25.12.5-*.tar.zst
          
          # BULLETPROOF FIX: Dynamic wildcard matching so it never throws an error finding the folder path
          mv openwrt-sdk-25.12.5-* openwrt_sdk

      - name: Configure Package Feeds for 25.12
        run: |
          cd openwrt_sdk
          # Force feed configs to lock onto the correct stable package structures
          sed -i 's|src-git packages .*|src-git packages https://github.com|' feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound

      - name: Apply Subnetcache Compilation Flag
        run: |
          cd openwrt_sdk
          # Initialize baseline config
          make defconfig
          
          # Inject internal code switches and user switches together to bypass default filters
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          echo "CONFIG_UNBOUND_SUBNETCACHE=y" >> .config
          
          make defconfig

      - name: Fast 3-Minute Compilation
        run: |
          cd openwrt_sdk
          export FORCE_UNSAFE_CONFIGURE=1
          # Build only the requested isolated package tree natively 
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: openwrt_sdk/bin/**/*.apk
