# Version 1.25.2-Production-v3 (Clean Pathing - Error-Free Compilation)
name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'   # Pulls the stable 25.12 release source tree
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound unbound-control

      - name: Inject Performance Features & Enforce Stability Patches
        run: |
          # UNIVERSAL PATHWAY: Targeting your preferred default feed directory structure
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Injecting Subnet-Cache, CacheDB, and resolving path structures..."
            
            # 1. Inject features that DO NOT require external compilation libraries
            sed -i 's|CONFIGURE_ARGS +=|CONFIGURE_ARGS += --enable-subnet --enable-cachedb --with-pthreads |g' "$MAKEFILE_PATH"
            
            # 2. THE CHOSEN SEGFAULT REMOVAL: Cleanly strip --enable-allsymbols to prevent musl-libc core dumps
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
            
            # FIXED: Removed the broken --with-conf-file and --with-run-dir paths to let OpenWrt macros work safely

            # Print results to terminal logs to verify execution succeeded before triggering make
            grep "CONFIGURE_ARGS" "$MAKEFILE_PATH"
          else
            echo "❌ Error: Universal package Makefile not found at $MAKEFILE_PATH!" && exit 1
          fi

      - name: Configure Target Architecture, v3 Flags and Core Variables
        run: |
          cd openwrt
          # Select exact MediaTek Filogic hardware target architecture for D-Link Aquila M30
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # HARDWARE SPEED VECTOR OPTIMIZATIONS (ARMv8-A v3 Cortex-A53 Core Tuning)
          echo "CONFIG_TARGET_OPTIMIZATION=\"-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53\"" >> .config
          
          # Force build core required dependencies natively into the firmware environment
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          
          make defconfig

      - name: Toolchain and Ordered Package Compilation (Takes 45 Minutes)
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "🛠️ Compiling tools and hardware-specific toolchain..."
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          echo "🧹 Performing clean build sweep to purge conflicting header fragments..."
          make package/feeds/packages/unbound/clean
          
          echo "🏗️ Phase 1: Executing single-thread compilation to protect dependency mapping..."
          make package/feeds/packages/unbound/compile V=s -j1
          
          echo "🚀 Phase 2: Parallel compilation to package final control binaries..."
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: fixed-unbound-1.25.2-apk
          path: openwrt/bin/**/*.apk
