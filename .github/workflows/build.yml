name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'   # Pulls the stable 25.12 release source tree
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          # Pull down official production packages matching the 25.12 branch
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound

      - name: Configure Target Architecture and Core Variables
        run: |
          cd openwrt
          # Select exact MediaTek Filogic hardware target architecture for D-Link Aquila M30
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Force compile Unbound components
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          
          # CORRECT COMPILER SWITCH: Enables the native subnetcache compilation logic safely
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          
          # Let the buildroot expand and validate dependencies
          make defconfig

      - name: Full Toolchain and Package Compilation (Takes 50 Minutes)
        run: |
          cd openwrt
          # We export this variable to prevent configuration check blocks from stopping root compilation
          export FORCE_UNSAFE_CONFIGURE=1
          
          # Build underlying core tools and hardware-cross compiler architectures cleanly
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # Isolate and cleanly compile your custom unbound package binary
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: openwrt/bin/packages/*/packages/unbound-daemon*.apk
