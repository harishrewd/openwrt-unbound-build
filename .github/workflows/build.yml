name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Unbound Package Natively via SDK
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: 'mediatek-filogic' # Targets your D-Link Aquila M30 processor core environment
          FEEDNAME: 'packages'
          PACKAGES: 'unbound-daemon libunbound unbound-control'
          INDEX: 1
          V: 's'
          # Force toggle the internal compilation config rules right inside the package make parameters
          EXTRA_CFLAGS: '-DUNBOUND_SUBNETCACHE=1' 
          EXTRA_CONFIGURE: '--enable-subnet'

      - name: Compress and Upload Custom APKs
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: bin/packages/*/packages/unbound*.apk
