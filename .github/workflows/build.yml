name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Download and Unpack OpenWrt 25.12 Snapshot SDK
        run: |
          # Use the active snapshot SDK endpoint for 25.12-based MediaTek Filogic targets
          wget https://openwrt.org
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-*-mediatek-filogic_* openwrt_sdk

      - name: Configure Package Feeds
        run: |
          cd openwrt_sdk
          # Update the default feed configuration rules to fetch the correct development tree
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound

      - name: Apply Subnetcache Compilation Flag
        run: |
          cd openwrt_sdk
          # Inject native compilation variables directly into SDK buildroot configuration
          echo "CONFIG_PACKAGE_libunbound=y" > .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          make defconfig

      - name: Fast Compilation
        run: |
          cd openwrt_sdk
          # Execute the localized single package package makefile engine
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12-apk
          path: openwrt_sdk/bin/packages/*/packages/unbound-daemon*.apk
