name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies and Unpackers
        run: |
          sudo apt update
          # Standard toolchain tools plus zstd compression helpers
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Download and Unpack OpenWrt 25.12.5 Stable SDK
        run: |
          # Pull down the verified stable 25.12.5 SDK for MediaTek Filogic targets
          wget https://openwrt.org
          
          # Unpack the file using zstd decompression flags
          tar --use-compress-program=zstd -xf openwrt-sdk-*.tar.zst
          mv openwrt-sdk-*-mediatek-filogic_* openwrt_sdk

      - name: Configure Package Feeds for 25.12.5
        run: |
          cd openwrt_sdk
          # Lock feeds directly to the stable 25.12 production branch
          sed -i 's|src-git packages .*|src-git packages https://github.com|' feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound

      - name: Apply Subnetcache Compilation Flag
        run: |
          cd openwrt_sdk
          # Native target flags that cleanly append the required subnetcache module logic 
          echo "CONFIG_PACKAGE_libunbound=y" > .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          make defconfig

      - name: Fast 3-Minute Compilation
        run: |
          cd openwrt_sdk
          # Executes compiling for just the single custom unbound binary block
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: openwrt_sdk/bin/packages/*/packages/unbound-daemon*.apk
