name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Download and Unpack OpenWrt 25.12.5 SDK
        run: |
          # Pull down the pre-compiled tools specifically matching your router firmware architecture
          wget https://openwrt.org
          tar -xf openwrt-sdk-*.tar.xz
          mv openwrt-sdk-*-mediatek-filogic_* openwrt_sdk

      - name: Configure Package Feeds
        run: |
          cd openwrt_sdk
          # Lock feeds directly to the stable 25.12 branch to avoid branch pollution
          sed -i 's|src-git packages .*|src-git packages https://github.com|' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound

      - name: Apply Subnetcache Compilation Flag
        run: |
          cd openwrt_sdk
          # Native target flags that cleanly append the required subnetcache module logic 
          echo "CONFIG_PACKAGE_libunbound=y" > .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          make defconfig

      - name: 3-Minute Fast Compilation
        run: |
          cd openwrt_sdk
          # Tells the SDK to skip cross-compiling host tools and instantly output the package binaries
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: openwrt_sdk/bin/packages/*/packages/unbound-daemon*.apk
