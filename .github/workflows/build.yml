name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies and Unpackers
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Download and Unpack OpenWrt 25.12.5 SDK
        run: |
          # Fetch the official stable release build SDK matching your router
          wget https://openwrt.org
          
          # Decompress cleanly using zstd handlers
          tar --use-compress-program=zstd -xf openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          mv openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64 openwrt_sdk

      - name: Configure Package Feeds for 25.12.5
        run: |
          cd openwrt_sdk
          # Force the feeds to pull from the stable 25.12 packages branch
          sed -i 's|src-git packages .*|src-git packages https://github.com|' feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install unbound-daemon libunbound

      - name: Apply Subnetcache Compilation Flag Safely
        run: |
          cd openwrt_sdk
          
          # CRITICAL FIX: Run defconfig FIRST to generate the default base system structure
          make defconfig
          
          # Append your custom switches smoothly using >> instead of erasing the file with >
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-subnetcache=y" >> .config
          
          # Re-run defconfig to validate the changes
          make defconfig

      - name: Fast 3-Minute Compilation
        run: |
          cd openwrt_sdk
          # FORCE_UNSAFE_CONFIGURE=1 stops the runner from failing when building as root
          export FORCE_UNSAFE_CONFIGURE=1
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: custom-unbound-25.12.5-apk
          path: openwrt_sdk/bin/packages/*/packages/unbound-daemon*.apk
