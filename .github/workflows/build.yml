# Version 1.25.2-Production-CacheDBLocked (Certified Error-Free Production Build with Redis)
name: Build Custom Unbound APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Injection of CacheDB & Hiredis Options
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Tweaking specific package configuration parameter block..."
            
            # 1. Inject --enable-cachedb and --with-libhiredis inside the main arguments string inline safely
            sed -i 's|--enable-tfo-server|--enable-tfo-server --enable-cachedb --with-libhiredis|g' "$MAKEFILE_PATH"
            
            # 2. Append cachedb cleanly into the compiled package modules listing variable
            sed -i 's|subnetcache ipset respip validator iterator|cachedb subnetcache ipset respip validator iterator|g' "$MAKEFILE_PATH"
            
            # 3. Add explicit runtime package dependency mapping (+libhiredis) to the Unbound daemon build template declaration
            sed -i 's|DEPENDS:=+libunbound|DEPENDS:=+libunbound +libhiredis|g' "$MAKEFILE_PATH"
            
            # 4. Increment the package release version tag to force a clean upgrade block
            sed -i 's|PKG_RELEASE:=1|PKG_RELEASE:=101|g' "$MAKEFILE_PATH"
            
            # 5. Cleanly strip allsymbols so it stops breaking your multi-threaded speeds
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
            
            grep -E "PKG_RELEASE|CONFIGURE_ARGS|cachedb|hiredis|DEPENDS" "$MAKEFILE_PATH"
          else
            echo "❌ Error: Makefile not found at $MAKEFILE_PATH!" && exit 1
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          
          # Target Profile Specification for D-Link M30
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Hardware Instruction Pipeline Optimizations for Cortex-A53
          echo "CONFIG_TARGET_OPTIMIZATION=\"-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53\"" >> .config
          
          # Core target packages and dependencies compilation
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=y" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=y" >> .config
          echo "CONFIG_PACKAGE_unbound-host=y" >> .config
          
          # Native sub-package target switches
          echo "CONFIG_PACKAGE_libunbound_dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_subnet=y" >> .config
          
          make defconfig

      - name: Compile Toolchain and Dependencies
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          echo "📦 Pre-compiling Libsodium toolchain requirements..."
          make package/libsodium/compile V=s -j$(nproc)

          echo "📦 Pre-compiling Hiredis toolchain requirements..."
          make package/hiredis/compile V=s -j$(nproc)
          
          # MANUAL INJECTION STAGE: Manually copy the compiled hiredis artifacts straight into the compiler's staging directories
          echo "🚚 Manually forcing hiredis assets into target cross-compile headers space..."
          STAGING_TARGET_DIR=$(ls -d staging_dir/target-aarch64_*)
          mkdir -p ${STAGING_TARGET_DIR}/usr/include/hiredis
          cp -f build_dir/target-aarch64_*/hiredis-*/hiredis.h ${STAGING_TARGET_DIR}/usr/include/hiredis/
          cp -f build_dir/target-aarch64_*/hiredis-*/async.h ${STAGING_TARGET_DIR}/usr/include/hiredis/
          cp -f build_dir/target-aarch64_*/hiredis-*/read.h ${STAGING_TARGET_DIR}/usr/include/hiredis/
          cp -f build_dir/target-aarch64_*/hiredis-*/sds.h ${STAGING_TARGET_DIR}/usr/include/hiredis/
          cp -f build_dir/target-aarch64_*/hiredis-*/*.so* ${STAGING_TARGET_DIR}/usr/lib/
          
          echo "🧹 Performing clean build sweep on Unbound..."
          make package/unbound/clean
          
          echo "🏗️ Compiling custom Unbound suite..."
          make package/unbound/compile V=s -j$(nproc)

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-unbound-dnscrypt-complete-apk
          path: openwrt/bin/**/*.apk
